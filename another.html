<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="index.html" class="back-btn">Back to Main</a>
    <h1>This is Another Document</h1>

    <p>Welcome to another HTML document linked from the main page.</p>

    <div id="colorBox"></div>

    <div>
        <p>Change Box Color:</p>
        <button onclick="changeColor('red')" id="red-btn">Red</button>
        <button onclick="changeColor('yellow')" id="yellow-btn">Yellow</button>
        <button onclick="changeColor('green')" id="green-btn">Green</button>
        <br><br>
        <button onclick="changeColor('white')" id="reset-color-btn">Reset</button>
    </div>
    <script>
    function changeColor(color) {
        document.getElementById('colorBox').style.background = color
    }
    </script>
</body>
</html>
